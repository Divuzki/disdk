name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose: the action reads `packageManager` from
      # package.json, and specifying both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @disdk/verify must be built before the server can typecheck against it.
      - run: pnpm build

      - run: pnpm -r typecheck

      # The whole protocol runs against an in-memory Solana stand-in, so no RPC
      # endpoint, network access, or funded keypair is needed here.
      - run: pnpm -r test

      - name: Check the CDN bundle stays small
        run: |
          size=$(gzip -c packages/sdk/dist/disdk.global.js | wc -c)
          echo "disdk.global.js is $((size / 1024)) KB gzipped"
          # The drop-in bundle loads on every visitor's page; a sudden jump
          # usually means a dependency got inlined that should be lazy.
          if [ "$size" -gt 30720 ]; then
            echo "::error::CDN bundle exceeded 30 KB gzipped ($size bytes)"
            exit 1
          fi
